name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    # Los tests de aislamiento necesitan una base real. Simularlos no sirve:
    # el punto es comprobar que Postgres aplica las policies, no que nuestro
    # código cree que las aplica.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: moneypilot
          POSTGRES_PASSWORD: moneypilot
          POSTGRES_DB: moneypilot
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U moneypilot"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    env:
      DATABASE_URL: postgres://moneypilot:moneypilot@localhost:55432/moneypilot
      DATABASE_APP_URL: postgres://moneypilot_app:moneypilot_app@localhost:55432/moneypilot

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Caracteres de control literales: si el separador U+001F del hash
      # canónico se pierde, el dedup deja de reconocer lo ya importado y la
      # siguiente importación duplica la base entera, sin un solo error.
      - name: Sin caracteres de control literales
        run: node scripts/check-control-chars.mjs

      - name: Lint y formato
        run: pnpm exec biome ci .

      - name: Typecheck
        run: pnpm exec tsc -b

      - name: Migraciones
        run: pnpm db:migrate

      # La migración crea el rol sin login a propósito. Acá se le da una
      # contraseña efímera, igual que en desarrollo local.
      - name: Rol de aplicación
        run: |
          PGPASSWORD=moneypilot psql -h localhost -p 55432 -U moneypilot -d moneypilot \
            -v ON_ERROR_STOP=1 \
            -c "alter role moneypilot_app login password 'moneypilot_app'"

      - name: Tests
        run: pnpm test
