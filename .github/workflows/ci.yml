name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Caracteres de control literales: si el separador U+001F del hash
      # canónico se pierde, el dedup deja de reconocer lo ya importado y la
      # siguiente importación duplica la base entera, sin un solo error.
      - name: Sin caracteres de control literales
        run: node scripts/check-control-chars.mjs

      - name: Lint y formato
        run: pnpm exec biome ci .

      - name: Typecheck
        run: pnpm exec tsc -b

      - name: Tests
        run: pnpm test
