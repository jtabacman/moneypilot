services:
  db:
    image: postgres:17-alpine
    container_name: moneypilot-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: moneypilot
      POSTGRES_PASSWORD: moneypilot
      POSTGRES_DB: moneypilot
      # Determinismo: el motor nunca debe depender del locale de la máquina
      # para ordenar ni para interpretar números.
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
      TZ: UTC
      PGTZ: UTC
    ports:
      - "55432:5432"
    volumes:
      - moneypilot-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moneypilot -d moneypilot"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  moneypilot-pgdata:
